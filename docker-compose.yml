services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: copexia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: copexia_db
      POSTGRES_USER: copexia_user
      POSTGRES_PASSWORD: copexia_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - copexia-network

  # Aplicación NestJS
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copexia-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 9000
      DATABASE_URL: postgresql://copexia_user:copexia_password@postgres:5432/copexia_db
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      # Mailjet Configuration
      EMAIL_SENDER: atomix18@gmail.com
      MAILJET_API_KEY: 7586a4f262572d5b593499f681168398
      MAILJET_SECRET_KEY: 395702c3b9e04bf03903429b214d9d60
      BACKOFFICE_RESET_PASSWORD_URL: http://localhost:9000/es/reset-password
      BACKOFFICE_BASE_URL: http://localhost:9000
    ports:
      - "9000:9000"
    depends_on:
      - postgres
    networks:
      - copexia-network
    volumes:
      - ./uploads:/app/uploads

  # Nginx como reverse proxy (opcional)
  nginx:
    image: nginx:alpine
    container_name: copexia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - copexia-network

volumes:
  postgres_data:

networks:
  copexia-network:
    driver: bridge
